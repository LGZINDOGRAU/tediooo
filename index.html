<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Hero</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        #gameArea {
            position: relative;
        }
        canvas {
            background-color: #222;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #0ff;
        }
        .controls {
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Pontuação: <span id="score">0</span></div>
    
    <div id="gameArea">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <div class="controls">
        Use as teclas: <strong>A</strong> (Verde), <strong>S</strong> (Vermelho), <strong>D</strong> (Amarelo), <strong>F</strong> (Azul)
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let notes = [];
        const keys = ['a', 's', 'd', 'f'];
        const colors = ['#00ff00', '#ff0000', '#ffff00', '#0000ff'];
        const laneWidth = canvas.width / 4;
        const hitZoneY = 500;
        const hitZoneHeight = 40;

        // Função para criar notas aleatórias
        function spawnNote() {
            const lane = Math.floor(Math.random() * 4);
            notes.push({
                x: lane * laneWidth,
                y: -50,
                color: colors[lane],
                lane: lane,
                speed: 4 + (score * 0.05) // Fica mais rápido com o tempo
            });
        }

        // Loop principal do jogo
        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar linha de acerto (Hit Zone)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(0, hitZoneY, canvas.width, hitZoneHeight);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(0, hitZoneY, canvas.width, hitZoneHeight);

            // Atualizar e desenhar notas
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += note.speed;

                // Desenhar a nota
                ctx.fillStyle = note.color;
                ctx.beginPath();
                ctx.arc(note.x + laneWidth / 2, note.y, 20, 0, Math.PI * 2);
                ctx.fill();

                // Remover nota se passar da tela (errou)
                if (note.y > canvas.height) {
                    notes.splice(i, 1);
                    score = Math.max(0, score - 5); // Perde ponto
                    scoreElement.innerText = score;
                }
            }

            requestAnimationFrame(updateGame);
        }

        // Detectar teclas pressionadas
        window.addEventListener('keydown', (e) => {
            const keyIndex = keys.indexOf(e.key.toLowerCase());
            
            if (keyIndex !== -1) {
                // Efeito visual ao apertar a tecla
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(keyIndex * laneWidth, hitZoneY, laneWidth, hitZoneHeight);

                // Checar acerto
                for (let i = 0; i < notes.length; i++) {
                    let note = notes[i];
                    if (note.lane === keyIndex && note.y > hitZoneY - 20 && note.y < hitZoneY + hitZoneHeight) {
                        notes.splice(i, 1); // Acertou, remove a nota
                        score += 10;
                        scoreElement.innerText = score;
                        break; 
                    }
                }
            }
        });

        // Iniciar o jogo
        setInterval(spawnNote, 800); // Cria uma nota a cada 800ms
        updateGame();

        // Dica de Áudio (Para adicionar sua música depois)
        // const musica = new Audio('sua_musica.mp3');
        // musica.play();
    </script>
</body>
</html>
