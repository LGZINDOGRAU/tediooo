<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Hero Mini</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f0f1a; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

    #ui { margin-bottom: 15px; }
    .hud { display: flex; gap: 20px; font-size: 1.2rem; font-weight: bold; margin-top: 10px; justify-content: center; }
    .hud div { background: #1f1f3a; padding: 8px 16px; border-radius: 8px; border: 1px solid #333; }
    
    select, button { padding: 8px 16px; font-size: 1rem; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; margin: 5px; }
    select { background: #2a2a4a; color: #fff; }
    button { background: #00e676; color: #000; transition: transform 0.1s; }
    button:hover { transform: scale(1.05); }

    #game-container { position: relative; width: 320px; height: 500px; background: #161625; border: 3px solid #333; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(0,255,200,0.1); }
    
    .lane { position: absolute; top: 0; width: 25%; height: 100%; border-right: 1px dashed rgba(255,255,255,0.1); }
    .lane:nth-child(1) { left: 0%; background: rgba(255, 82, 82, 0.05); }
    .lane:nth-child(2) { left: 25%; background: rgba(255, 177, 66, 0.05); }
    .lane:nth-child(3) { left: 50%; background: rgba(46, 213, 115, 0.05); }
    .lane:nth-child(4) { left: 75%; background: rgba(30, 144, 255, 0.05); border-right: none; }

    .hit-zone { position: absolute; bottom: 30px; width: 100%; height: 50px; border-top: 2px solid #555; border-bottom: 2px solid #555; background: rgba(255,255,255,0.05); }

    .target-key { position: absolute; bottom: 33px; width: 60px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; border: 2px solid #fff; }
    .k-0 { left: 10px; border-color: #ff5252; color: #ff5252; }
    .k-1 { left: 90px; border-color: #ffb142; color: #ffb142; }
    .k-2 { left: 170px; border-color: #2ed573; color: #2ed573; }
    .k-3 { left: 250px; border-color: #1e90ff; color: #1e90ff; }
    .target-key.active { background: white; color: black; }

    .note { position: absolute; width: 60px; height: 24px; border-radius: 6px; box-shadow: 0 0 10px currentColor; }
    .n-0 { background: #ff5252; color: #ff5252; left: 10px; }
    .n-1 { background: #ffb142; color: #ffb142; left: 90px; }
    .n-2 { background: #2ed573; color: #2ed573; left: 170px; }
    .n-3 { background: #1e90ff; color: #1e90ff; left: 250px; }
  </style>
</head>
<body>

  <div id="ui">
    <h1>RHYTHM HERO</h1>
    <div style="margin-top: 10px;">
      <select id="songSelect">
        <option value="synth">Música 1: Eletrônica (Fácil)</option>
        <option value="rock">Música 2: Rock Beat (Médio)</option>
        <option value="speed">Música 3: Speed Run (Difícil)</option>
      </select>
      <button onclick="startGame()">JOGAR</button>
    </div>
