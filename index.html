<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythm Hero | Criado por Luis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
    
    body {
      background: radial-gradient(circle at center, #1a0b2e 0%, #090314 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .header-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff007f, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .author-badge {
      font-size: 0.85rem;
      color: #00f0ff;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .controls-panel {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      outline: none;
    }

    select {
      background: #25123e;
      color: #00f0ff;
      border: 1px solid #00f0ff;
    }

    button {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      transition: all 0.2s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.9);
    }

    .hud {
      display: flex;
      gap: 12px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hud-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    #game-container {
      position: relative;
      width: 320px;
      height: 480px;
      background: linear-gradient(180deg, #090314 0%, #15092b 100%);
      border: 3px solid #00f0ff;
      border-radius: 16px;
      overflow: hidden;
