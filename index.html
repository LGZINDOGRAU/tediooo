<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Geometry Dash: Cyberpunk Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050d;
      font-family: 'Orbitron', sans-serif;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0d0b26 0%, #030208 100%);
    }

    canvas {
      display: block;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      border-radius: 4px;
      background-color: #000;
    }

    /* Modern UI Overlays */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    .hidden {
      display: none !important;
    }

    /* Glassmorphic Panel styling */
    .panel {
      background: rgba(12, 10, 32, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(255, 0, 128, 0.1);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      max-width: 90%;
      width: 520px;
      animation: panelFadeIn 0.3s ease-out;
    }

    @keyframes panelFadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    h1.title {
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f0ff 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      margin-bottom: 0.5rem;
    }

    h2.subtitle {
      font-size: 1.1rem;
      color: #00f0ff;
      letter-spacing: 3px;
      margin-bottom: 1.8rem;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(255, 0, 128, 0.15) 100%);
      border: 1.5px solid #00f0ff;
      color: #fff;
      padding: 14px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .btn:hover {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.4) 0%, rgba(255, 0, 128, 0.4) 100%);
      border-color: #ff007f;
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-accent {
      background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
      color: #000;
      border: none;
      font-weight: 900;
    }

    .btn-accent:hover {
      background: linear-gradient(135deg, #ff007f 0%, #ff5500 100%);
      color: #fff;
    }

    .btn-icon {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.2rem;
    }

    /* Level Selection Card Styling */
    .level-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .level-card:hover {
      border-color: #ff007f;
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.02);
    }

    .level-info h3 {
      font-size: 1.1rem;
      color: #00f0ff;
    }

    .level-info p {
      font-size: 0.85rem;
      color: #aaa;
      font-family: 'Rajdhani', sans-serif;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-easy { background: rgba(0, 255, 128, 0.2); color: #00ff80; border: 1px solid #00ff80; }
    .badge-medium { background: rgba(255, 200, 0, 0.2); color: #ffc800; border: 1px solid #ffc800; }
    .badge-hard { background: rgba(255, 0, 80, 0.2); color: #ff0050; border: 1px solid #ff0050; }

    /* Customization Color Picker Grid */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    .color-swatch {
      width: 100%;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 10px #fff;
    }

    /* HUD Bar during Gameplay */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .progress-container {
      flex: 1;
      max-width: 450px;
      height: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 10px;
      overflow: hidden;
      margin: 0 20px;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #ff007f);
      box-shadow: 0 0 10px #00f0ff;
      transition: width 0.05s linear;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.75rem;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }

    .hud-text {
      font-size: 0.9rem;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,240,255,0.8);
    }

    /* Touch Controls Overlay for Mobile */
    #touch-controls {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 6;
    }

    .practice-btn {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      backdrop-filter: blur(4px);
    }

    /* Sound Toggle Button */
    #sound-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 12;
      pointer-events: auto;
      background: rgba(12, 10, 32, 0.7);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

        <p style="font-size:1.2rem; margin:10px 0; color:#fff;">100% DE SUCESSO! 🏆</p>
        <div style="font-size:2.5rem; margin-bottom:15px;">⭐⭐⭐</div>
        <div class="btn-group">
          <button class="btn btn-accent" id="btn-next-level">PRÓXIMO NÍVEL</button>

        </div>
      </div>

  <script>
    /* ==========================================================================
       1. SOUND & AUDIO ENGINE (Web Audio API Synthesizer)
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmNode = null;
        this.isPlayingBGM = false;
        this.bpm = 130;
        this.timer = null;
        this.step = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, startVol = 0.3, endVol = 0.001) {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      playJump() {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(480, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      }

      playOrb() {
        this.playTone(880, 'triangle', 0.18, 0.4);
        setTimeout(() => this.playTone(1320, 'sine', 0.2, 0.3), 40);
      }

      playPortal() {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch(e) {}
      }

      playDeath() {
        if (this.muted || !this.ctx) return;
        try {
          // Noise explosion + low plunge
          const bufferSize = this.ctx.sampleRate * 0.3;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
          noise.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();

          this.playTone(120, 'sawtooth', 0.3, 0.4, 0.01);
        } catch(e) {}
      }

      playWin() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((n, idx) => {
          setTimeout(() => this.playTone(n, 'triangle', 0.3, 0.3), idx * 100);
        });
      }

      startBGM(levelIndex = 0) {
        this.init();
        this.stopBGM();
        this.isPlayingBGM = true;
        this.step = 0;
        
        const bpms = [128, 140, 155];
        this.bpm = bpms[levelIndex] || 130;
        const interval = (60 / this.bpm / 4) * 1000;

        // Procedural Synthwave BGM Sequences
        const basslines = [
          [110, 110, 220, 110, 146.8, 110, 164.8, 130.8],
          [130.8, 130.8, 261.6, 130.8, 174.6, 130.8, 196, 146.8],
          [146.8, 293.6, 146.8, 293.6, 196, 392, 164.8, 329.6]
        ];

        const melodyLines = [
          [440, 0, 554.37, 0, 659.25, 0, 554.37, 0],
          [523.25, 659.25, 783.99, 659.25, 523.25, 783.99, 880, 783.99],
          [587.33, 783.99, 880, 1046.5, 880, 783.99, 587.33, 440]
        ];

        const curBass = basslines[levelIndex % basslines.length];
        const curMelody = melodyLines[levelIndex % melodyLines.length];

        this.timer = setInterval(() => {
          if (!this.isPlayingBGM || this.muted) return;
          const s = this.step % 16;
          
          // Kick / Snare beat
          if (s % 4 === 0) {
            this.playTone(100, 'sine', 0.08, 0.4); // Kick
          } else if (s % 4 === 2) {
            this.playTone(250, 'triangle', 0.05, 0.15); // Snare/Hi-hat
          }

          // Bass synth
          const bassNote = curBass[Math.floor(s / 2) % curBass.length];
          if (s % 2 === 0 && bassNote) {
            this.playTone(bassNote / 2, 'sawtooth', 0.12, 0.2);
          }

          // Arpeggio Lead
          const melNote = curMelody[s % curMelody.length];
          if (melNote && s % 2 === 1) {
            this.playTone(melNote, 'sine', 0.1, 0.15);
          }

          this.step++;
        }, interval);
      }

      stopBGM() {
        this.isPlayingBGM = false;
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       2. GAME CONSTANTS & GLOBALS
       ========================================================================== */
    const CANVAS_WIDTH = 1280;
    const CANVAS_HEIGHT = 720;
    const GRID_SIZE = 45;
    const GROUND_Y = 580;

    const COLOR_PALETTE = [
      '#00f0ff', '#ff007f', '#00ff80', '#ffc800', '#a000ff',
      '#ffffff', '#ff3300', '#0077ff', '#ff00cc', '#33ff00'
    ];

    const GAME_STATES = {
      MENU: 'MENU',
      LEVEL_SELECT: 'LEVEL_SELECT',
      CUSTOMIZE: 'CUSTOMIZE',
      PLAYING: 'PLAYING',
      PAUSED: 'PAUSED',
      GAMEOVER: 'GAMEOVER',
      VICTORY: 'VICTORY'
    };

    let currentState = GAME_STATES.MENU;

    // Local Storage Data & Settings
    let playerData = JSON.parse(localStorage.getItem('gd_cyber_player')) || {
      primaryColor: '#00f0ff',
      secondaryColor: '#ff007f',
      faceStyle: 0,
      practiceMode: false,
      scores: [0, 0, 0],
      attempts: [0, 0, 0]
    };

    function savePlayerData() {
      localStorage.setItem('gd_cyber_player', JSON.stringify(playerData));
    }

    /* ==========================================================================
       3. LEVEL DEFINITIONS & BUILDER
       ========================================================================== */
    // Object Types: B=Block, S=Spike, HB=HalfBlock, OY=YellowOrb, OB=BlueOrb,
    // PY=YellowPad, PB=BluePad, PS=ShipPortal, PC=CubePortal, PG=GravFlipPortal,
    // PN=GravNormalPortal, S1=Speed1x, S2=Speed2x
    const LEVELS = [
      {
        name: "Neon Dash",
        difficulty: "Fácil",
        badgeClass: "badge-easy",
        bgStart: "#0a071e",
        bgEnd: "#1a0b36",
        objects: [
          { type: 'B', x: 10, y: 1 },
          { type: 'S', x: 15, y: 1 },
          { type: 'S', x: 16, y: 1 },
          { type: 'B', x: 20, y: 1 }, { type: 'B', x: 21, y: 1 },
          { type: 'S', x: 25, y: 1 },
          { type: 'OY', x: 28, y: 3 },
          { type: 'S', x: 30, y: 1 }, { type: 'S', x: 31, y: 1 },
          { type: 'PY', x: 35, y: 1 },
          { type: 'B', x: 38, y: 4 }, { type: 'B', x: 39, y: 4 }, { type: 'B', x: 40, y: 4 },
          { type: 'S', x: 39, y: 5 },
          { type: 'B', x: 46, y: 1 }, { type: 'B', x: 47, y: 2 }, { type: 'B', x: 48, y: 3 },
          { type: 'S', x: 51, y: 1 }, { type: 'S', x: 52, y: 1 }, { type: 'S', x: 53, y: 1 },
          { type: 'OY', x: 57, y: 3 },
          { type: 'B', x: 60, y: 2 }, { type: 'B', x: 61, y: 2 },
          { type: 'OB', x: 65, y: 4 },
          { type: 'S', x: 68, y: 1 },
          { type: 'B', x: 72, y: 1 }, { type: 'B', x: 73, y: 2 }, { type: 'B', x: 74, y: 3 },

    /* ==========================================================================
       4. PARTICLE ENGINE & VISUAL EFFECTS
       ========================================================================== */
    class Particle {
      constructor(x, y, vx, vy, color, size, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.maxLife = life;
        this.life = life;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    let particles = [];

    function createExplosion(x, y, color) {
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        const size = Math.random() * 8 + 4;
        const life = Math.random() * 30 + 20;
        particles.push(new Particle(x, y, vx, vy, color, size, life));
      }
    }

    function createOrbPulse(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = (Math.PI * 2 / 16) * i;
        const speed = 4;
        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, 4, 15));
      }
    }

    /* ==========================================================================
       5. PLAYER & PHYSICS ENGINE
       ========================================================================== */
    class Player {
      constructor() {
        this.size = 38;
        this.reset();
      }

      reset() {
        this.x = 100;
        this.y = GROUND_Y - this.size;
        this.vx = 8.5; // Base horizontal speed
        this.vy = 0;
        this.rotation = 0;
        this.mode = 'CUBE'; // CUBE or SHIP
        this.gravityDir = 1; // 1 = Normal, -1 = Inverted
        this.onGround = false;
        this.isDead = false;
        this.speedMult = 1.0;
        this.holdingJump = false;
        this.orbBuffered = false;
      }

      getHitbox() {
        // Slightly forgiving hitbox (padding of 4px)
        const p = 4;
        return {
          x: this.x + p,
          y: this.y + p,
          w: this.size - p * 2,
          h: this.size - p * 2
        };
      }

      jump() {
        if (this.mode === 'CUBE') {
          if (this.onGround) {
            this.vy = -14.2 * this.gravityDir;
            this.onGround = false;
            sound.playJump();
          }
        }
      }

      update() {
        if (this.isDead) return;

        // Base Forward Motion
        this.x += this.vx * this.speedMult;

        // Mode Specific Physics
        if (this.mode === 'CUBE') {
          // Gravity Application
          this.vy += 0.85 * this.gravityDir;
          this.y += this.vy;

          // Rotation Logic
          if (!this.onGround) {
            this.rotation += 8.5 * this.gravityDir;
          } else {
            // Snap rotation smoothly to nearest 90deg on ground
            this.rotation = Math.round(this.rotation / 90) * 90;
          }

          // Check Jump trigger if holding down key/mouse
          if (this.holdingJump && this.onGround) {
            this.jump();
          }

        } else if (this.mode === 'SHIP') {
          // Rocket Ship Physics
          if (this.holdingJump) {
            this.vy -= 0.7 * this.gravityDir;
          } else {
            this.vy += 0.7 * this.gravityDir;
          }

          // Terminal Velocity limit for ship
          this.vy = Math.max(-10, Math.min(10, this.vy));
          this.y += this.vy;

          // Ship pitch angle interpolation
          this.rotation = this.vy * 3.5;
        }

        // Particle Trail Generation
        if (Math.random() < 0.6) {
          particles.push(new Particle(
            this.x - 5,
            this.y + this.size / 2 + (Math.random() * 10 - 5),
            -2, Math.random() * 2 - 1,
            playerData.secondaryColor,
            Math.random() * 6 + 2,
            18
          ));
        }

        // Screen Top/Bottom Floor Collision Bounds
        if (this.gravityDir === 1 && this.y >= GROUND_Y - this.size) {
          this.y = GROUND_Y - this.size;
          this.vy = 0;
          this.onGround = true;
        } else if (this.gravityDir === -1 && this.y <= 0) {
          this.y = 0;
          this.vy = 0;
          this.onGround = true;
        } else {
          this.onGround = false;
        }

        // Ceiling Death/Boundary check in Ship Mode
        if (this.y < -50 || this.y > GROUND_Y + 100) {
          triggerGameOver();
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
        ctx.rotate((this.rotation * Math.PI) / 180);

        if (this.mode === 'CUBE') {
          // Draw Main Outer Cube Body
          ctx.fillStyle = playerData.primaryColor;
          ctx.strokeStyle = playerData.secondaryColor;
          ctx.lineWidth = 3;
          ctx.shadowColor = playerData.primaryColor;
          ctx.shadowBlur = 12;
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
          ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);

          // Draw Inner Decorative Square
          ctx.fillStyle = playerData.secondaryColor;
          ctx.fillRect(-this.size / 4, -this.size / 4, this.size / 2, this.size / 2);

          // Draw Face Details based on customization style
          ctx.fillStyle = '#000';
          if (playerData.faceStyle === 0) { // Classic Eyes
            ctx.fillRect(-10, -8, 6, 8);
            ctx.fillRect(4, -8, 6, 8);
            ctx.fillRect(-8, 4, 16, 4);
          } else if (playerData.faceStyle === 1) { // Ninja Visor
            ctx.fillRect(-14, -6, 28, 8);
            ctx.fillStyle = playerData.primaryColor;
            ctx.fillRect(-6, -4, 4, 4);
            ctx.fillRect(2, -4, 4, 4);
          } else if (playerData.faceStyle === 2) { // Robot Mono-Eye
            ctx.fillRect(-12, -6, 24, 6);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(-4, -5, 8, 4);
          } else if (playerData.faceStyle === 3) { // X-Eyes
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            // Left X
            ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(-4, -2); ctx.moveTo(-4, -8); ctx.lineTo(-10, -2); ctx.stroke();
            // Right X
            ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(10, -2); ctx.moveTo(10, -8); ctx.lineTo(4, -2); ctx.stroke();
          }

        } else if (this.mode === 'SHIP') {
          // Draw Rocket Ship Shape
          ctx.fillStyle = playerData.primaryColor;
          ctx.strokeStyle = playerData.secondaryColor;
          ctx.lineWidth = 3;
          ctx.shadowColor = playerData.primaryColor;
          ctx.shadowBlur = 15;

          ctx.beginPath();
          ctx.moveTo(this.size / 2, 0);
          ctx.lineTo(-this.size / 2, -this.size / 2);
          ctx.lineTo(-this.size / 3, 0);
          ctx.lineTo(-this.size / 2, this.size / 2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Ship Thruster Flame
          if (this.holdingJump) {
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.moveTo(-this.size / 2, -6);
            ctx.lineTo(-this.size / 2 - 15, 0);
            ctx.lineTo(-this.size / 2, 6);
            ctx.fill();
          }
        }

        ctx.restore();
      }
    }

    const player = new Player();

    /* ==========================================================================
       6. PRACTICE MODE & CHECKPOINT SYSTEM
       ========================================================================== */
    let checkpoints = [];

    function setCheckpoint() {
      if (!playerData.practiceMode || currentState !== GAME_STATES.PLAYING) return;
      checkpoints.push({
        x: player.x,
        y: player.y,
        vy: player.vy,
        mode: player.mode,
        gravityDir: player.gravityDir,
        speedMult: player.speedMult,
        rotation: player.rotation
      });
      sound.playTone(1000, 'sine', 0.1, 0.2);
    }

    function removeCheckpoint() {
      if (!playerData.practiceMode || checkpoints.length === 0) return;
      checkpoints.pop();
      sound.playTone(400, 'sine', 0.1, 0.2);
    }

    function restoreCheckpoint() {
      if (checkpoints.length > 0) {
        const cp = checkpoints[checkpoints.length - 1];
        player.x = cp.x;
        player.y = cp.y;
        player.vy = cp.vy;
        player.mode = cp.mode;
        player.gravityDir = cp.gravityDir;
        player.speedMult = cp.speedMult;
        player.rotation = cp.rotation;
        player.isDead = false;
        return true;
      }
      return false;
    }

    /* ==========================================================================
       7. COLLISION & WORLD UPDATE
       ========================================================================== */
    let levelProgress = 0;

    function checkCollisions() {
      if (player.isDead || !activeLevelData) return;

      const pHit = player.getHitbox();

      for (let obj of activeLevelData.worldObjects) {
        // Skip distant objects for performance
        if (obj.x < player.x - 100 || obj.x > player.x + 800) continue;

        // 1. SPIKE COLLISION (HAZARD)
        if (obj.type === 'S') {
          // Triangle hazard hitbox test
          if (
            pHit.x < obj.x + obj.w &&
            pHit.x + pHit.w > obj.x &&
            pHit.y < obj.y + obj.h &&
            pHit.y + pHit.h > obj.y
          ) {
            triggerGameOver();
            return;
          }
        }

        // 2. SOLID BLOCK COLLISION
        else if (obj.type === 'B') {
          if (
            pHit.x < obj.x + obj.w &&
            pHit.x + pHit.w > obj.x &&
            pHit.y < obj.y + obj.h &&
            pHit.y + pHit.h > obj.y
          ) {
            // Landing on top of block
            const prevY = player.y - player.vy;
            if (player.gravityDir === 1 && prevY + player.size <= obj.y + 12) {
              player.y = obj.y - player.size;
              player.vy = 0;
              player.onGround = true;
            } else if (player.gravityDir === -1 && prevY >= obj.y + obj.h - 12) {
              player.y = obj.y + obj.h;
              player.vy = 0;
              player.onGround = true;
            } else {
              // Frontal collision death
              triggerGameOver();
              return;
            }
          }
        }

        // 3. ORBS & PADS (INTERACTIVES)
        else if (obj.type === 'OY' || obj.type === 'OB') { // Yellow / Blue Orb
          const dist = Math.hypot((pHit.x + pHit.w / 2) - (obj.x + obj.w / 2), (pHit.y + pHit.h / 2) - (obj.y + obj.h / 2));
          if (dist < 45 && player.holdingJump && !obj.activated) {
            obj.activated = true;
            createOrbPulse(obj.x + obj.w / 2, obj.y + obj.h / 2, obj.type === 'OY' ? '#ffc800' : '#00f0ff');
            sound.playOrb();

            if (obj.type === 'OY') {
              player.vy = -14.5 * player.gravityDir;
            } else if (obj.type === 'OB') {
              player.gravityDir *= -1;
              player.vy = -8 * player.gravityDir;
            }
          } else if (!player.holdingJump) {
            obj.activated = false;
          }
        }

        else if (obj.type === 'PY') { // Yellow Pad
          if (pHit.x < obj.x + obj.w && pHit.x + pHit.w > obj.x && pHit.y < obj.y + obj.h && pHit.y + pHit.h > obj.y) {
            player.vy = -18 * player.gravityDir;
            sound.playJump();
            createOrbPulse(obj.x + obj.w / 2, obj.y + obj.h / 2, '#ffc800');
          }
        }

        // 4. PORTALS
        else if (obj.type === 'PS') { // Ship Portal
          if (Math.abs(player.x - obj.x) < 25) {
            if (player.mode !== 'SHIP') sound.playPortal();
            player.mode = 'SHIP';
          }
        } else if (obj.type === 'PC') { // Cube Portal
          if (Math.abs(player.x - obj.x) < 25) {
            if (player.mode !== 'CUBE') sound.playPortal();
            player.mode = 'CUBE';
          }
        } else if (obj.type === 'PG') { // Gravity Flip Portal
          if (Math.abs(player.x - obj.x) < 25 && player.gravityDir !== -1) {
            player.gravityDir = -1;
            sound.playPortal();
          }
        } else if (obj.type === 'PN') { // Normal Gravity Portal
          if (Math.abs(player.x - obj.x) < 25 && player.gravityDir !== 1) {
            player.gravityDir = 1;
            sound.playPortal();
          }
        } else if (obj.type === 'S2') { // 2x Speed Portal
          if (Math.abs(player.x - obj.x) < 25) {
            player.speedMult = 1.35;
          }
        }

        // 5. FINISH LINE
        else if (obj.type === 'FINISH') {
          if (player.x >= obj.x) {
            triggerVictory();
            return;
          }
        }
      }

      // Update Progress %
      if (activeLevelData.finishX) {
        levelProgress = Math.min(100, Math.floor((player.x / activeLevelData.finishX) * 100));
        document.getElementById('level-progress-bar').style.width = levelProgress + '%';
        document.getElementById('level-progress-text').innerText = levelProgress + '%';
      }
    }

    function triggerGameOver() {
      if (player.isDead) return;
      player.isDead = true;
      sound.playDeath();
      createExplosion(player.x + player.size / 2, player.y + player.size / 2, playerData.primaryColor);

      // Save Best Progress
      if (levelProgress > playerData.scores[currentLevelIdx]) {
        playerData.scores[currentLevelIdx] = levelProgress;
        savePlayerData();
      }

      setTimeout(() => {
        if (playerData.practiceMode && checkpoints.length > 0) {
          restoreCheckpoint();
        } else {
          currentState = GAME_STATES.GAMEOVER;
          document.getElementById('gameover-stats').innerText = `PROGRESSO: ${levelProgress}%`;
          showScreen('menu-gameover');
        }
      }, 600);
    }

    function triggerVictory() {
      sound.playWin();
      playerData.scores[currentLevelIdx] = 100;
      savePlayerData();
      currentState = GAME_STATES.VICTORY;
      showScreen('menu-complete');
    }

    /* ==========================================================================
       8. RENDERING ENGINE (CANVAS SYNTHWAVE ART)
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const aspect = CANVAS_WIDTH / CANVAS_HEIGHT;
      let w = window.innerWidth;
      let h = window.innerHeight;

      if (w / h > aspect) {
        w = h * aspect;
      } else {
        h = w / aspect;
      }

      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      canvas.width = CANVAS_WIDTH;
      canvas.height = CANVAS_HEIGHT;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawWorld() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 1. Dynamic Parallax Synthwave Background
      const levelConfig = LEVELS[currentLevelIdx] || LEVELS[0];
      const bgGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      bgGrad.addColorStop(0, levelConfig.bgStart);
      bgGrad.addColorStop(1, levelConfig.bgEnd);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Camera Offset calculation
      const cameraX = player.x - 200;

      // Draw Parallax Synthwave Sun
      ctx.save();
      ctx.fillStyle = '#ff007f';
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.arc(CANVAS_WIDTH / 2, 260, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Background Grid Lines
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
      ctx.lineWidth = 1;
      const gridOffset = (cameraX * 0.2) % 60;
      for (let x = -gridOffset; x < CANVAS_WIDTH; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, CANVAS_HEIGHT);
        ctx.stroke();
      }

      // 2. Ground Floor Render
      ctx.fillStyle = '#060412';
      ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
      ctx.stroke();

      // Floor Moving Grid Lines
      ctx.strokeStyle = 'rgba(255, 0, 127, 0.4)';
      ctx.lineWidth = 2;
      const floorOffset = cameraX % 45;
      for (let x = -floorOffset; x < CANVAS_WIDTH; x += 45) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x - 40, CANVAS_HEIGHT);
        ctx.stroke();
      }

      // 3. Render World Objects
      if (activeLevelData) {
        ctx.save();
        ctx.translate(-cameraX, 0);

        for (let obj of activeLevelData.worldObjects) {
          if (obj.x < cameraX - 100 || obj.x > cameraX + CANVAS_WIDTH + 100) continue;

          // SOLID BLOCK
          if (obj.type === 'B') {
            ctx.fillStyle = '#0f0c29';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
            ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

            // Inner cross pattern
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
            ctx.beginPath();
            ctx.moveTo(obj.x, obj.y); ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
            ctx.moveTo(obj.x + obj.w, obj.y); ctx.lineTo(obj.x, obj.y + obj.h);
            ctx.stroke();
          }

          // SPIKE (TRIANGLE)
          else if (obj.type === 'S') {
            ctx.fillStyle = '#ff0050';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ff0050';
            ctx.shadowBlur = 12;

            ctx.beginPath();
            ctx.moveTo(obj.x, obj.y + obj.h);
            ctx.lineTo(obj.x + obj.w / 2, obj.y);
            ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          // ORBS (YELLOW / BLUE)
          else if (obj.type === 'OY' || obj.type === 'OB') {
            const color = obj.type === 'OY' ? '#ffc800' : '#00f0ff';
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.arc(obj.x + obj.w / 2, obj.y + obj.h / 2, obj.w / 2, 0, Math.PI * 2);
            ctx.fill();

            // Ring
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(obj.x + obj.w / 2, obj.y + obj.h / 2, obj.w / 2 + 5, 0, Math.PI * 2);
            ctx.stroke();
          }

          // PADS
          else if (obj.type === 'PY') {
            ctx.fillStyle = '#ffc800';
            ctx.shadowColor = '#ffc800';
            ctx.shadowBlur = 10;
            ctx.fillRect(obj.x, obj.y + obj.h - 10, obj.w, 10);
          }

          // PORTALS
          else if (obj.type.startsWith('P') || obj.type.startsWith('S2')) {
            let color = '#a000ff';
            if (obj.type === 'PS') color = '#ff007f';
            if (obj.type === 'PC') color = '#00ff80';
            if (obj.type === 'PG') color = '#00f0ff';

            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;

            ctx.beginPath();
            ctx.ellipse(obj.x + obj.w / 2, obj.y + obj.h / 2, obj.w / 2, obj.h / 2, 0, 0, Math.PI * 2);
            ctx.stroke();
          }

          // FINISH LINE
          else if (obj.type === 'FINISH') {
            ctx.fillStyle = '#00ff80';
            ctx.shadowColor = '#00ff80';
            ctx.shadowBlur = 25;
            ctx.fillRect(obj.x, 0, 12, GROUND_Y);
          }
        }

        // Draw Practice Mode Checkpoints
        if (playerData.practiceMode) {
          ctx.fillStyle = '#00ff80';
          for (let cp of checkpoints) {
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, 8, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Draw Particles
        for (let p of particles) {
          p.draw(ctx);
        }

        // Draw Player
        if (!player.isDead) {
          player.draw(ctx);
        }

        ctx.restore();
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    /* ==========================================================================
       9. GAME LOOP & STATE MANAGEMENT
       ========================================================================== */
    function gameLoop() {
      if (currentState === GAME_STATES.PLAYING) {
        player.update();
        checkCollisions();
        updateParticles();
      }

      drawWorld();
      requestAnimationFrame(gameLoop);
    }

    function buildLevelData(levelIndex) {
      const raw = LEVELS[levelIndex];
      const worldObjects = [];
      let maxFinishX = 3000;

      raw.objects.forEach(item => {
        const xPx = item.x * GRID_SIZE;
        const yPx = GROUND_Y - (item.y * GRID_SIZE);

        let w = GRID_SIZE;
        let h = GRID_SIZE;

        if (item.type === 'S') {
          w = GRID_SIZE - 6;
          h = GRID_SIZE;
        } else if (item.type === 'PY') {
          h = 12;
        } else if (item.type.startsWith('P')) {
          w = 40;
          h = 90;
        } else if (item.type === 'FINISH') {
          maxFinishX = xPx;
        }

        worldObjects.push({
          type: item.type,
          x: xPx,
          y: yPx,
          w: w,
          h: h,
          activated: false
        });
      });

      return {
        worldObjects: worldObjects,
        finishX: maxFinishX
      };
    }

    function startLevel(idx) {
      currentLevelIdx = idx;
      activeLevelData = buildLevelData(idx);
      player.reset();
      particles = [];
      checkpoints = [];
      levelProgress = 0;

      playerData.attempts[idx]++;
      savePlayerData();

      document.getElementById('attempt-count').innerText = `TENTATIVA ${playerData.attempts[idx]}`;
      
      hideAllScreens();
      document.getElementById('hud').classList.remove('hidden');
      if (playerData.practiceMode) {
        document.getElementById('touch-controls').classList.remove('hidden');
      }

      currentState = GAME_STATES.PLAYING;
      sound.startBGM(idx);
    }

    /* ==========================================================================
       10. UI & EVENT LISTENERS
       ========================================================================== */
    function hideAllScreens() {
      const screens = ['menu-main', 'menu-levels', 'menu-custom', 'menu-pause', 'menu-gameover', 'menu-complete', 'hud', 'touch-controls'];
      screens.forEach(id => document.getElementById(id).classList.add('hidden'));
    }

    function showScreen(id) {
      hideAllScreens();
      document.getElementById(id).classList.remove('hidden');
    }

    // Input Handling (Keyboard, Mouse, Touch)
    function handleJumpStart(e) {
      if (e.target.closest('button')) return; // Ignore UI clicks
      if (currentState === GAME_STATES.PLAYING) {
        player.holdingJump = true;
        player.jump();
      }
    }

    function handleJumpEnd() {
      player.holdingJump = false;
    }

    window.addEventListener('keydown', (e) => {
      sound.init();
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (currentState === GAME_STATES.GAMEOVER) {
          startLevel(currentLevelIdx);
        } else {
          handleJumpStart(e);
        }
      }
      if (e.code === 'KeyP' || e.code === 'Escape') {
        if (currentState === GAME_STATES.PLAYING) {
          currentState = GAME_STATES.PAUSED;
          sound.stopBGM();
          showScreen('menu-pause');
        } else if (currentState === GAME_STATES.PAUSED) {
          showScreen('hud');
          currentState = GAME_STATES.PLAYING;
          sound.startBGM(currentLevelIdx);
        }
      }
      if (e.code === 'KeyR' && (currentState === GAME_STATES.PLAYING || currentState === GAME_STATES.GAMEOVER)) {
        startLevel(currentLevelIdx);
      }
      if (e.code === 'KeyZ') setCheckpoint();
      if (e.code === 'KeyX') removeCheckpoint();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        handleJumpEnd();
      }
    });

    window.addEventListener('mousedown', handleJumpStart);
    window.addEventListener('mouseup', handleJumpEnd);
    window.addEventListener('touchstart', (e) => { handleJumpStart(e); }, { passive: true });
    window.addEventListener('touchend', handleJumpEnd);

    // Render Levels in Level Select Screen
    function renderLevelSelect() {
      const container = document.getElementById('levels-container');
      container.innerHTML = '';

      LEVELS.forEach((lvl, idx) => {
        const card = document.createElement('div');
        card.className = 'level-card';
        const bestScore = playerData.scores[idx] || 0;
        card.innerHTML = `
          <div class="level-info">
            <h3>${lvl.name} <span class="badge ${lvl.badgeClass}">${lvl.difficulty}</span></h3>
            <p>RECORDE: ${bestScore}% | TENTATIVAS: ${playerData.attempts[idx] || 0}</p>
          </div>
          <button class="btn btn-accent" onclick="startLevel(${idx})">JOGAR</button>
        `;
        container.appendChild(card);
      });
    }

    // Customization Screen Render & Color Pickers
    function setupCustomization() {
      const pGrid = document.getElementById('primary-colors');
      const sGrid = document.getElementById('secondary-colors');
      pGrid.innerHTML = '';
      sGrid.innerHTML = '';

      COLOR_PALETTE.forEach(c => {
        const pSwatch = document.createElement('div');
        pSwatch.className = `color-swatch ${playerData.primaryColor === c ? 'selected' : ''}`;
        pSwatch.style.backgroundColor = c;
        pSwatch.onclick = () => {
          playerData.primaryColor = c;
          savePlayerData();
          setupCustomization();
          drawCustomPreview();
        };
        pGrid.appendChild(pSwatch);

        const sSwatch = document.createElement('div');
        sSwatch.className = `color-swatch ${playerData.secondaryColor === c ? 'selected' : ''}`;
        sSwatch.style.backgroundColor = c;
        sSwatch.onclick = () => {
          playerData.secondaryColor = c;
          savePlayerData();
          setupCustomization();
          drawCustomPreview();
        };
        sGrid.appendChild(sSwatch);
      });

      for (let i = 0; i < 4; i++) {
        document.getElementById(`face-${i}`).onclick = () => {
          playerData.faceStyle = i;
          savePlayerData();
          drawCustomPreview();
        };
      }
      drawCustomPreview();
    }

    function drawCustomPreview() {
      const pCanvas = document.getElementById('custom-preview');
      const pCtx = pCanvas.getContext('2d');
      pCtx.clearRect(0, 0, 90, 90);

      const size = 60;
      pCtx.save();
      pCtx.translate(15, 15);

      // Body
      pCtx.fillStyle = playerData.primaryColor;
      pCtx.strokeStyle = playerData.secondaryColor;
      pCtx.lineWidth = 4;
      pCtx.fillRect(0, 0, size, size);
      pCtx.strokeRect(0, 0, size, size);

      // Inner Square
      pCtx.fillStyle = playerData.secondaryColor;
      pCtx.fillRect(15, 15, 30, 30);

      // Face
      pCtx.fillStyle = '#000';
      if (playerData.faceStyle === 0) {
        pCtx.fillRect(12, 14, 10, 12);
        pCtx.fillRect(38, 14, 10, 12);
        pCtx.fillRect(16, 38, 28, 6);
      } else if (playerData.faceStyle === 1) {
        pCtx.fillRect(8, 18, 44, 12);
        pCtx.fillStyle = playerData.primaryColor;
        pCtx.fillRect(20, 22, 6, 6);
        pCtx.fillRect(34, 22, 6, 6);
      } else if (playerData.faceStyle === 2) {
        pCtx.fillRect(10, 18, 40, 10);
        pCtx.fillStyle = '#ff0000';
        pCtx.fillRect(22, 20, 16, 6);
      } else if (playerData.faceStyle === 3) {
        pCtx.strokeStyle = '#000';
        pCtx.lineWidth = 3;
        pCtx.beginPath(); pCtx.moveTo(12, 12); pCtx.lineTo(24, 24); pCtx.moveTo(24, 12); pCtx.lineTo(12, 24); pCtx.stroke();
        pCtx.beginPath(); pCtx.moveTo(36, 12); pCtx.lineTo(48, 24); pCtx.moveTo(48, 12); pCtx.lineTo(36, 24); pCtx.stroke();
      }

      pCtx.restore();
    }

    // UI Buttons Binding
    document.getElementById('btn-play').onclick = () => {
      sound.init();
      renderLevelSelect();
      showScreen('menu-levels');
    };

    document.getElementById('btn-custom').onclick = () => {
      sound.init();
      setupCustomization();
      showScreen('menu-custom');
    };

    document.getElementById('btn-practice-toggle').onclick = () => {
      playerData.practiceMode = !playerData.practiceMode;
      savePlayerData();
      document.getElementById('btn-practice-toggle').innerText = `MODO PRÁTICA [${playerData.practiceMode ? 'LIG' : 'DESL'}]`;
    };

    document.getElementById('btn-level-back').onclick = () => showScreen('menu-main');
    document.getElementById('btn-custom-back').onclick = () => showScreen('menu-main');

    document.getElementById('btn-pause-hud').onclick = () => {
      currentState = GAME_STATES.PAUSED;
      sound.stopBGM();
      showScreen('menu-pause');
    };

    document.getElementById('btn-resume').onclick = () => {
      showScreen('hud');
      currentState = GAME_STATES.PLAYING;
      sound.startBGM(currentLevelIdx);
    };

    document.getElementById('btn-restart-pause').onclick = () => startLevel(currentLevelIdx);
    document.getElementById('btn-menu-pause').onclick = () => {
      sound.stopBGM();
      currentState = GAME_STATES.MENU;
      showScreen('menu-main');
    };

    document.getElementById('btn-retry').onclick = () => startLevel(currentLevelIdx);
    document.getElementById('btn-gameover-menu').onclick = () => {
      currentState = GAME_STATES.MENU;
      showScreen('menu-main');
    };

    document.getElementById('btn-next-level').onclick = () => {
      if (currentLevelIdx + 1 < LEVELS.length) {
        startLevel(currentLevelIdx + 1);
      } else {
        showScreen('menu-main');
      }
    };

    document.getElementById('btn-complete-menu').onclick = () => {
      currentState = GAME_STATES.MENU;
      showScreen('menu-main');
    };

    document.getElementById('btn-p-checkpoint').onclick = setCheckpoint;
    document.getElementById('btn-p-remove').onclick = removeCheckpoint;

    // Audio Mute Button Toggle
    document.getElementById('sound-toggle').onclick = () => {
      sound.init();
      sound.muted = !sound.muted;
      document.getElementById('sound-toggle').innerText = sound.muted ? '🔇' : '🔊';
    };

    // Initialize Practice Button Text State
    document.getElementById('btn-practice-toggle').innerText = `MODO PRÁTICA [${playerData.practiceMode ? 'LIG' : 'DESL'}]`;

    // Start Main Game Render Loop
    gameLoop();
  </script>
</body>
</html>
